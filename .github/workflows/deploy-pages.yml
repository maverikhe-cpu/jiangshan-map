name: Deploy GitHub Pages

# Manual only. A push or merge to main does not publish this site.
# Run this workflow from the Actions tab when a human has decided the tree is fit to publish.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Stage Runtime Static Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage the publish allowlist
        run: |
          node scripts/stage_site.js --check
          rm -rf _site
          cp -a site _site
          du -sh _site
          echo "Staged file count: $(find _site -type f | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
